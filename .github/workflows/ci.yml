name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Format, unit tests, lint and the build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # The emulator matrix runs on a Mac before merge while the repo is private, to stay
      # inside the org's free Actions minutes. It moves here when the repo goes public.
      - name: Check
        run: >-
          ./gradlew --console=plain
          ktfmtCheck
          :core:test
          :platform:testDebugUnitTest
          :app:testDebugUnitTest
          :core:lint
          :platform:lintDebug
          :app:lintDebug
          :app:assembleDebug
          :app:assembleRelease
      # The release build above is unsigned; it's here so R8 runs on every change, not first on a
      # release tag. The notes check fails a version bump that has no RELEASE_NOTES.md section.
      - name: Release scripts
        run: |
          shellcheck scripts/*.sh scripts/spikes/*.sh
          scripts/release-notes.sh "v$(sed -n 's/^droidective\.versionName=//p' gradle.properties)" >/dev/null
      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: "**/build/reports/"
          retention-days: 7
